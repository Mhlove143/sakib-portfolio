<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sakibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081416" />
      <stop offset="100%" stop-color="#020809" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Outer Rounded Dark Badge with Emerald Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#sakibGrad)" stroke-width="2.5" filter="url(#glow)" />

  <!-- Stylized Geometric "S" Monogram -->
  <path
    d="M40 22.5C40 18.5 36.5 15.5 32 15.5C27 15.5 23.5 19 23.5 23.5C23.5 29.5 39 30.5 39 39.5C39 44.5 35 48.5 30 48.5C25 48.5 22 45 22 40"
    stroke="url(#sakibGrad)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- High-Tech Accent Online Emerald Node -->
  <circle cx="48" cy="16" r="4" fill="#10B981" stroke="#081416" stroke-width="1.8" />
  <circle cx="16" cy="48" r="3" fill="#06B6D4" opacity="0.8" />
</svg>
